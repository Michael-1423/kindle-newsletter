newsletter:
  title: "The Daily Signal"
  subtitle: "Your interests. No agenda."
  author: "Personal Edition"
  target_words: 3400
  timezone: "Asia/Kolkata"
  lookback_hours: 36

sections:
  - id: global
    title: "Global Politics"
    kind: news
    words: 850
    max_stories: 5
    focus: "geopolitics, policy, elections, conflict, diplomacy — skip celebrity, lifestyle and sport"
    sources:
      - name: BBC World
        url: "http://feeds.bbci.co.uk/news/world/rss.xml"
      - name: Al Jazeera
        url: "https://www.aljazeera.com/xml/rss/all.xml"
      - name: DW World
        url: "https://rss.dw.com/rdf/rss-en-world"
      - name: Politico EU
        url: "https://www.politico.eu/feed/"
      - name: NPR World
        url: "https://feeds.npr.org/1004/rss.xml"

  - id: tech
    title: "Tech & AI"
    kind: news
    words: 850
    max_stories: 5
    focus: "AI research, new discoveries, science, computing, space — skip gadget deals and product hype"
    exclude:
      - black friday
      - cyber monday
      - deal
      - discount
      - sale
      - prime day
      - coupon
      - affiliate
      - gift guide
      - stocking stuffer
    sources:
      - name: Ars Technica
        url: "https://feeds.arstechnica.com/arstechnica/index"
        weight: 0.6
      - name: MIT Technology Review
        url: "https://www.technologyreview.com/feed/"
        weight: 1.5
      - name: The Verge
        url: "https://www.theverge.com/rss/index.xml"
        weight: 0.5
      - name: Hacker News
        type: hn_algolia
        weight: 0.7
      - name: ScienceDaily
        url: "https://www.sciencedaily.com/rss/top/science.xml"
        weight: 1.6
      - name: arXiv cs.AI
        type: arxiv
        query: "cat:cs.AI"
        max_results: 8
        lookback_hours: 120
        weight: 1.6

  - id: sports
    title: "Sports"
    kind: news
    words: 600
    max_stories: 4
    focus: "major results, transfers, records — skip gossip and betting odds"
    sources:
      - name: BBC Sport
        url: "http://feeds.bbci.co.uk/sport/rss.xml"
      - name: Sky Sports
        url: "https://www.skysports.com/rss/12040"
      - name: ESPN
        url: "https://www.espn.com/espn/rss/news"

  - id: history
    title: "History"
    kind: feature
    words: 650
    prompt: >-
      Pick the single most interesting event from today's list and write a narrative
      deep-dive. Explain the context people don't know, why it mattered, and one
      surprising detail. Do not just list facts — tell it as a story.
    sources:
      - name: Wikipedia On This Day
        type: wikipedia_onthisday

  - id: fact
    title: "One Random Fact"
    kind: feature
    words: 300
    prompt: >-
      Pick the single most surprising or counterintuitive item from the candidates
      and write a short, vivid piece. Explain why it is true and why it is strange.
      Avoid trivia that everyone already knows.
    sources:
      - name: Wikipedia Random
        type: wikipedia_random
        count: 6
